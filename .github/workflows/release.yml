name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm and GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate release tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: npm ci
      - name: Run release gate
        run: npm run check
      - name: Pack release artifact
        run: |
          mkdir -p "$RUNNER_TEMP/studio-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/studio-package"
          package_tarballs=("$RUNNER_TEMP/studio-package"/*.tgz)
          test "${#package_tarballs[@]}" -eq 1
          package_tarball="${package_tarballs[0]}"
          echo "PACKAGE_TARBALL=$package_tarball" >> "$GITHUB_ENV"
      - name: Publish npm package
        run: npm publish "$PACKAGE_TARBALL" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" "$PACKAGE_TARBALL" --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
